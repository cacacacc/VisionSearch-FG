project:
  name: VisionSearch-FG
  phase: phase1_baseline
  seed: 42

data:
  dataset: CUB-200-2011
  root: data/raw/CUB_200_2011
  image_size: 224
  num_workers: 2

model:
  backbone: resnet18
  pretrained: true
  embedding_dim: 512
  num_classes: 200

training:
  epochs: 10
  batch_size: 16
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001

evaluation:
  metrics:
    - accuracy
    - top5_accuracy

outputs:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
