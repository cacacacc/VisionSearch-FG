project:
  name: VisionSearch-FG
  phase: phase1_augmentation_ablation
  seed: 42

experiment:
  name: ablation_resnet18_fullft_aug_hflip

data:
  dataset: CUB-200-2011
  root: data/raw/CUB_200_2011
  image_size: 224
  augmentation: hflip
  num_workers: 2
  train_split: train
  val_split: train
  train_ids_path: data/processed/splits/cub_train_ids_seed42.txt
  val_ids_path: data/processed/splits/cub_val_ids_seed42.txt

model:
  backbone: resnet18
  pretrained: true
  freeze_backbone: false
  fine_tune_mode: full
  embedding_dim: 512
  num_classes: 200

training:
  epochs: 20
  batch_size: 16
  optimizer: adamw
  learning_rate: 0.0001
  backbone_learning_rate: 0.0001
  classifier_learning_rate: 0.0001
  weight_decay: 0.0001

runtime:
  max_train_batches:
  max_val_batches:

evaluation:
  metrics:
    - accuracy
    - top5_accuracy

outputs:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
