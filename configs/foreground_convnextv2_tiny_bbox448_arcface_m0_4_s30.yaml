project:
  name: VisionSearch-FG
  phase: phase11_angular_margin_ablation
  seed: 42

experiment:
  name: foreground_convnextv2_tiny_bbox448_arcface_m0_4_s30

data:
  dataset: CUB-200-2011
  root: data/raw/CUB_200_2011
  image_size: 448
  augmentation: hflip
  crop_mode: bbox
  bbox_margin: 0.15
  num_workers: 2
  train_split: train
  val_split: train
  train_ids_path: data/processed/splits/cub_train_ids_seed42.txt
  val_ids_path: data/processed/splits/cub_val_ids_seed42.txt

model:
  backbone: timm:convnextv2_tiny.fcmae_ft_in22k_in1k_384
  pretrained: true
  freeze_backbone: false
  fine_tune_mode: full
  embedding_dim: 768
  num_classes: 200
  classifier_type: angular_margin
  margin_type: arcface
  margin: 0.4
  scale: 30.0

training:
  epochs: 30
  batch_size: 8
  optimizer: adamw
  learning_rate: 0.0001
  backbone_learning_rate: 0.00005
  classifier_learning_rate: 0.0005
  weight_decay: 0.0001
  ce_weight: 1.0
  supcon_weight: 0.0
  two_view: false
  selection_metric: val_accuracy
  early_stopping_patience: 5

runtime:
  max_train_batches:
  max_val_batches:

evaluation:
  metrics:
    - accuracy
    - macro_f1
    - top5_accuracy
    - recall@1
    - recall@5
    - recall@10
    - mAP
    - parameter_count
    - training_time

outputs:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
