project:
  name: VisionSearch-FG
  phase: phase1_baseline
  seed: 42

experiment:
  name: baseline_resnet18_unfrozen_protocol

data:
  dataset: CUB-200-2011
  root: data/raw/CUB_200_2011
  image_size: 224
  num_workers: 2
  train_split: train
  val_split: train
  train_ids_path: data/processed/splits/cub_train_ids_seed42.txt
  val_ids_path: data/processed/splits/cub_val_ids_seed42.txt

model:
  backbone: resnet18
  pretrained: true
  freeze_backbone: false
  embedding_dim: 512
  num_classes: 200

training:
  epochs: 25
  batch_size: 16
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001

runtime:
  max_train_batches:
  max_val_batches:

evaluation:
  metrics:
    - accuracy
    - top5_accuracy

outputs:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
